<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Skener EAN – Dětské krůčky</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  :root {
    --cream:#E5DFD6;
    --brown:#AE6965;
    --brown-dark:#8a4a46;
    --tan:#A58B71;
    --sage:#7A816C;
    --text:#3d2b1f;
    --text-light:#6b5548;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 {
    font-size: 1.3rem;
    color: var(--brown);
    margin: 12px 0 4px;
    text-align: center;
  }
  .podnadpis {
    font-size: 0.85rem;
    color: var(--text-light);
    text-align: center;
    margin-bottom: 16px;
  }
  #videoWrap {
    width: 100%;
    max-width: 420px;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 4/3;
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  .ramecek {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80%; height: 100px;
    border: 3px solid var(--sage);
    border-radius: 10px;
    pointer-events: none;
  }
  #status {
    margin-top: 20px;
    padding: 14px 20px;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
    max-width: 420px;
    width: 100%;
  }
  .st-cekam { background: #fff; color: var(--text-light); border: 1px solid var(--tan); }
  .st-ok { background: #e0f0d8; color: #3a6b2a; }
  .st-chyba { background: #fde0e0; color: #a33; }
  .pocitadlo {
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--text-light);
    text-align: center;
  }
  #skenovatBtn {
    margin-top: 16px;
    padding: 18px 40px;
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--brown), var(--brown-dark));
    border: none;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(139,69,19,0.3);
    width: 100%;
    max-width: 420px;
    transition: transform 0.15s;
  }
  #skenovatBtn:active { transform: scale(0.96); }
  #skenovatBtn:disabled { opacity: 0.6; }
</style>
</head>
<body>
  <h1>🦔 Skener EAN kódů</h1>
  <p class="podnadpis">Namiřte telefon na čárový kód – odešle se automaticky do prodejny na PC.</p>

  <div id="videoWrap">
    <video id="video" autoplay muted playsinline></video>
    <div class="ramecek"></div>
  </div>

  <div id="status" class="st-cekam">📷 Připravuji kameru…</div>

  <button id="skenovatBtn" onclick="skenovatTed()">📸 Skenovat teď</button>

  <div class="pocitadlo" id="pocitadlo"></div>

<script>
const API = 'https://detskekrucky1.onrender.com/api/mobilni-sken';
const params = new URLSearchParams(window.location.search);
const sessionId = params.get('session');
const statusEl = document.getElementById('status');
const pocitadloEl = document.getElementById('pocitadlo');
let pocetOdeslanych = 0;
let reader = null;
let zpracovavam = false;

if (!sessionId) {
  statusEl.className = 'st-chyba';
  statusEl.textContent = '❌ Chybí relace. Naskenujte prosím QR kód znovu z PC.';
} else {
  spustitKameru();
}

async function spustitKameru() {
  const video = document.getElementById('video');
  try {
    reader = new ZXing.BrowserMultiFormatReader();
    const constraints = {
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();
    statusEl.className = 'st-cekam';
    statusEl.textContent = '📷 Čekám na naskenování…';
    dekodovat(video);
  } catch (e) {
    statusEl.className = 'st-chyba';
    statusEl.textContent = '❌ Kamera není dostupná: ' + e.message;
  }
}

function dekodovat(video) {
  const smycka = async () => {
    if (!reader) return;
    if (!zpracovavam) {
      try {
        const result = await reader.decodeFromVideoElement(video);
        if (result) {
          odeslatKod(result.getText());
        }
      } catch (e) {
        // NotFoundException = kód zatím není vidět, pokračujeme
      }
    }
    requestAnimationFrame(smycka);
  };
  requestAnimationFrame(smycka);
}

async function skenovatTed() {
  const video = document.getElementById('video');
  const btn = document.getElementById('skenovatBtn');
  if (!reader || zpracovavam) return;

  btn.disabled = true;
  zpracovavam = true; // pozastaví automatický sken na pozadí, ať si nekonkurují
  statusEl.className = 'st-cekam';
  statusEl.textContent = '🔍 Zkouším přečíst…';

  // Rychlá série pokusů (kamera potřebuje chvíli na doostření)
  let nalezeno = false;
  for (let i = 0; i < 8 && !nalezeno; i++) {
    try {
      const result = await reader.decodeFromVideoElement(video);
      if (result) {
        nalezeno = true;
        zpracovavam = false;
        odeslatKod(result.getText());
      }
    } catch (e) {
      // kód zatím nenalezen, zkusíme znovu
    }
    if (!nalezeno) await new Promise(r => setTimeout(r, 150));
  }

  if (!nalezeno) {
    zpracovavam = false;
    statusEl.className = 'st-chyba';
    statusEl.textContent = '❌ Kód se nepodařilo přečíst, zkuste to znovu blíž.';
  }
  btn.disabled = false;
}

async function odeslatKod(ean) {
  zpracovavam = true;
  statusEl.className = 'st-cekam';
  statusEl.textContent = '⏳ Odesílám kód ' + ean + '…';
  try {
    const res = await fetch(API + '/' + encodeURIComponent(sessionId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ean })
    });
    if (res.ok) {
      pocetOdeslanych++;
      statusEl.className = 'st-ok';
      statusEl.textContent = '✅ Odesláno: ' + ean;
      pocitadloEl.textContent = 'Naskenováno celkem: ' + pocetOdeslanych;
      if (navigator.vibrate) navigator.vibrate(100);
    } else {
      statusEl.className = 'st-chyba';
      statusEl.textContent = '❌ Chyba při odesílání, zkuste znovu.';
    }
  } catch (e) {
    statusEl.className = 'st-chyba';
    statusEl.textContent = '❌ Chyba spojení, zkuste znovu.';
  }
  setTimeout(() => {
    statusEl.className = 'st-cekam';
    statusEl.textContent = '📷 Čekám na další kód…';
    zpracovavam = false;
  }, 1500);
}
</script>
</body>
</html>
