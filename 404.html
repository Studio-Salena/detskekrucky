<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Stránka nenalezena – Dětské krůčky</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* GitHub Pages ukáže tuto stránku pro každou neexistující adresu webu - proto absolutní odkazy */
:root{--cream:#E5DFD6;--brown:#AE6965;--brown-dark:#8a4a46;--tan-light:#d4c4b0;--text:#3d2b1f;--text-light:#6b5548}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--text);font-family:'Nunito',system-ui,sans-serif;padding:24px 16px}
main{background:#fff;border:2px solid var(--tan-light);border-radius:28px;padding:40px 28px;max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--tan-light)}
h1{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:2.1rem;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0;color:var(--text-light);line-height:1.6}
.tlacitka{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
a.btn{padding:12px 22px;border-radius:24px;font-weight:700;text-decoration:none;border:2px solid var(--brown)}
a.btn.hlavni{background:var(--brown);color:#fff}
a.btn.hlavni:hover{background:var(--brown-dark);border-color:var(--brown-dark)}
a.btn.vedlejsi{color:var(--brown);background:#fff}
a:focus-visible{outline:3px solid var(--brown-dark);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/logo.jpg" alt="Dětské krůčky">
  <h1>Jejda, tady botička není &#128099;</h1>
  <p>Tuhle stránku jsme nenašli. Možná se změnila adresa, nebo v odkazu chybí písmenko.</p>
  <div class="tlacitka">
    <a class="btn hlavni" href="/eshop.html">Prohlédnout boty</a>
    <a class="btn vedlejsi" href="/">Na úvodní stránku</a>
  </div>
  <p style="font-size:0.85rem">Potřebujete poradit? Volejte <a href="tel:773517733" style="color:var(--brown)">773 517 733</a> nebo pište na <a href="mailto:info@detskekrucky.cz" style="color:var(--brown)">info@detskekrucky.cz</a>.</p>
</main>
</body>
</html>
