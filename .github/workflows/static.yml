# Nasazení webu na GitHub Pages (www.detskekrucky.cz)
#
# Na web jde JEN čistý adresář _site/ s výslovně povolenými soubory
# (seznam: scripts/web/verejne-soubory.js). Serverový kód, testy, dokumentace,
# zálohovací skripty ani pracovní soubory se nepublikují - backend běží na Renderu
# přímo z repozitáře a web je nepotřebuje.
#
# Sestavení balíček před nahráním zkontroluje (chybějící soubor, zakázaný obsah,
# tajný údaj, rozbitý místní odkaz). Jakákoli chyba zastaví běh před nahráním
# a na webu zůstane poslední nasazená verze.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test public file rules
        # Jen vestavěné moduly Node - bez npm install
        run: node --test test/web-verejne-soubory.test.js
      - name: Build and check public site
        # Čistý _site/ jen s povolenými soubory + kontroly; chyba = konec, nic se nenahraje
        run: node scripts/web/sestavit-web.js _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Jen sestavený a zkontrolovaný balíček, ne celý repozitář
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
