# Nasazení webu na GitHub Pages (www.detskekrucky.cz)
#
# Na web jde JEN čistý adresář _site/ s výslovně povolenými soubory
# (seznam: scripts/web/verejne-soubory.js). Serverový kód, testy, dokumentace,
# zálohovací skripty ani pracovní soubory se nepublikují - backend běží na Renderu
# přímo z repozitáře a web je nepotřebuje.
#
# Sestavení balíček před nahráním zkontroluje (chybějící soubor, zakázaný obsah,
# tajný údaj, rozbitý místní odkaz). Jakákoli chyba zastaví běh před nahráním
# a na webu zůstane poslední nasazená verze.
#
# KATALOG (SEO krok 2): stránky /kategorie/<slug>/ a /produkt/<slug>/ se generují z veřejného
# exportu GET /api/katalog/export (jen čtení, bez tajných údajů). Každou hodinu se sestaví
# znovu - bez pushe do repozitáře a bez restartu backendu; nasadí se jen při změně obsahu.
# Výpadek API nebo neúspěšná kontrola = nic se nenasadí, web zůstává.
#
# NÁVRAT webu na starší obsah (docs/nasazeni-webu.md): Actions → tento workflow →
# Run workflow → do "obsah_z" zadat commit nebo tag. Obsah se vezme z něj, ale sestaví
# se s DNEŠNÍM seznamem povolených souborů a dnešními kontrolami. Nikdy nespouštět
# znovu běh z doby před omezením (commit cd5e75e) - ten by publikoval celý repozitář.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Každou hodinu (23. minuta): ceny, dostupnost a kategorie z adminu se do hodiny promítnou do stránek
  schedule:
    - cron: '23 * * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      obsah_z:
        description: 'Návrat: commit (SHA) nebo tag, ze kterého vzít veřejný obsah. Prázdné = aktuální main.'
        required: false
        default: ''
        type: string
      povolit_velky_pokles:
        description: 'Povolit velký úbytek modelů nebo kategorií (jen když je to záměr, např. hromadné stažení zboží)'
        required: false
        default: false
        type: boolean

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_opakovani.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout public content for rollback
        # Jen při ručním návratu. Hodnota jde jen do "ref" (ne do shellu).
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.obsah_z != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.obsah_z }}
          path: _obsah
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test public file rules
        # Jen vestavěné moduly Node - bez npm install
        run: node --test test/web-verejne-soubory.test.js test/web-katalog.test.js
      - name: Build and check public site
        id: sestaveni
        # Čistý _site/ jen s povolenými soubory + stránky katalogu + kontroly; chyba = konec, nic se nenahraje.
        # Při návratu je zdrojem obsahu _obsah/ (starší commit), seznam a kontroly zůstávají dnešní.
        # Hodinový běh beze změny obsahu zapíše nasadit=false a další kroky se přeskočí.
        env:
          ZDROJ: ${{ github.event_name == 'workflow_dispatch' && inputs.obsah_z != '' && '_obsah' || '.' }}
          JEN_PRI_ZMENE: ${{ github.event_name == 'schedule' }}
          POVOLIT_POKLES: ${{ github.event_name == 'workflow_dispatch' && inputs.povolit_velky_pokles }}
        run: node scripts/web/sestavit-web.js _site --zdroj "$ZDROJ" --katalog https://detskekrucky1.onrender.com/api/katalog/export --predchozi https://www.detskekrucky.cz/katalog-verze.json
      - name: Setup Pages
        if: steps.sestaveni.outputs.nasadit == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.sestaveni.outputs.nasadit == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          # Jen sestavený a zkontrolovaný balíček, ne celý repozitář
          path: _site
      - name: Deploy to GitHub Pages
        if: steps.sestaveni.outputs.nasadit == 'true'
        id: deployment
        # 24. 11. 2026 tento krok jednou selhal hláškou „No artifacts named github-pages“, i když
        # artefakt v běhu existoval (nahraný ve stejné sekundě). Příčina není prokázaná; hláška sama
        # doporučuje opakovat. Proto jeden další pokus po krátké pauze - web mezitím zůstává.
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Check failed deploy before retry
        # deploy-pages@v5 nastaví page_url hned po vytvoření nasazení (src/index.js). Bez page_url
        # nasazení nevzniklo (chyba při hledání artefaktu nebo při vytváření) -> jeden další pokus.
        # S page_url nasazení vzniklo a selhalo (akce ho při chybě sama ruší) -> NEopakovat, chyba běhu.
        if: steps.sestaveni.outputs.nasadit == 'true' && steps.deployment.outcome == 'failure'
        id: po_chybe
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -n "$PAGE_URL" ]; then
            echo "::error::Nasazení bylo vytvořeno a selhalo - opakování se neprovádí, web zůstává na poslední verzi."
            exit 1
          fi
          echo "První pokus nasazení nevytvořil (bez page_url). Za 30 s jeden další pokus."
          sleep 30
          echo "opakovat=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to GitHub Pages (retry)
        # Nejvýš jeden další pokus; bez continue-on-error - když selže, běh skončí chybou
        if: steps.po_chybe.outputs.opakovat == 'true'
        id: deployment_opakovani
        uses: actions/deploy-pages@v5
